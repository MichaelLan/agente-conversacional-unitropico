[project]
name = "unitropico-ingestion"
version = "0.1.0"
description = "Worker Python + Cloudflare Workflow de ingesta: OCR, chunking, embeddings e indexación"
requires-python = ">=3.14,<3.15"
dependencies = ["workers-runtime-sdk==1.9.6"]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.4", "workers-py==1.17.9"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
extend-exclude = [".venv-workers", "python_modules", ".wrangler"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D100", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"
