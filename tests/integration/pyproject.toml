[project]
name = "unitropico-integration"
version = "0.1.0"
description = "Pruebas de integración API -> service binding -> RAG en CPython"
requires-python = ">=3.14,<3.15"
# Mismas versiones exactas que apps/api y apps/rag (coinciden en las compartidas).
dependencies = [
  "fastapi==0.162.2",
  "pydantic==2.14.3",
  "langchain-core==1.8.3",
]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.4"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D100", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"
