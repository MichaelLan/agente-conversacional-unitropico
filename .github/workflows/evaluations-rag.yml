name: RAG evaluation harness quality

# Calidad del harness únicamente: lint, formato y tests con un servidor falso
# local. NO ejecuta evaluaciones contra servicios reales ni usa secretos.
on:
  push:
    paths:
      - 'evaluations/rag/**'
      - '.github/workflows/evaluations-rag.yml'
  pull_request:
    paths:
      - 'evaluations/rag/**'
      - '.github/workflows/evaluations-rag.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Evaluations RAG / lint, format, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: evaluations/rag
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          enable-cache: true
          cache-dependency-glob: |
            evaluations/rag/pyproject.toml
            evaluations/rag/uv.lock
      - name: Install locked dependencies
        run: uv sync --locked --group dev
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Validate dataset schema
        run: uv run python -m unitropico_eval validate
      - name: Test
        run: uv run pytest
