<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8fafc" />
    <meta name="robots" content="noindex" />
    <title>Sin conexión · Administración</title>
    <link rel="icon" href="/admin/icons/icon.svg" type="image/svg+xml" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #f8fafc; color: #0f172a;
        padding: max(1.5rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(1.5rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left)); box-sizing: border-box; }
      main { width: 100%; max-width: 24rem; background: #fff; border-radius: 0.75rem; box-shadow: 0 0 0 1px #e2e8f0; padding: 1.5rem; text-align: center; }
      img { width: 3rem; height: 3rem; }
      h1 { font-size: 1.125rem; margin: 0.75rem 0 0.5rem; }
      p { margin: 0 0 1.25rem; color: #475569; line-height: 1.5; }
      a { display: flex; align-items: center; justify-content: center; min-height: 2.75rem; border-radius: 0.375rem; background: #0f172a; color: #fff; text-decoration: none; font-weight: 500; }
      a:focus-visible { outline: 2px solid #008236; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/admin/icons/icon.svg" alt="" />
      <h1>Sin conexión: el asistente necesita internet</h1>
      <p>El panel trabaja siempre contra el servidor y no guarda datos sin conexión. Revisa tu conexión y vuelve a intentarlo.</p>
      <a href="/admin/">Reintentar</a>
    </main>
  </body>
</html>
