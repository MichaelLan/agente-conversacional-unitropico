[project]
name = "unitropico-ocr-evaluations"
version = "0.1.0"
description = "Evaluaciones OCR offline de Unitrópico (sin dependencias de runtime)"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.4"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
extend-exclude = [".artifacts"]

[tool.ruff.lint]
# Sin reglas D: son scripts de evaluación y pruebas unittest, no una API pública.
select = ["E", "F", "I", "UP", "B", "C4", "BLE"]
# El formateador gestiona el código; quedan solo cadenas largas de mensajes/pruebas.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# unittest sin instalar el paquete: las pruebas añaden la raíz a sys.path antes de importar.
"tests/*" = ["E402"]
# Scripts ejecutables: desactivan bytecode antes de importar pilot.
"remaining.py" = ["E402"]
"remaining_send.py" = ["E402"]
"prepare_selective.py" = ["E402"]
"selective_send.py" = ["E402"]
"prepare_alt_pilot.py" = ["E402"]
"prepare_alt_v2.py" = ["E402"]
"alt_ocr_v2.py" = ["E402"]
"alt_ocr.py" = ["E402"]
"assemble_cache.py" = ["E402"]
"assemble_final_cache.py" = ["E402"]
"final_sources.py" = ["E402"]
"final_corrections.py" = ["E402"]
"final_override.py" = ["E402"]
# B023: los lambdas/closures se invocan de forma síncrona dentro de la misma iteración
# (no se difieren), así que no hay bug de enlace tardío.
"tests/test_extract.py" = ["E402", "B023"]
"tests/test_remaining.py" = ["E402", "B023"]
"tests/test_remaining_send.py" = ["E402", "B023"]
